# Render blueprint. Push this repo, then in Render choose New > Blueprint and
# point it at the repository — it provisions the web service and the database.
services:
  - type: web
    name: designplus
    runtime: python
    plan: starter
    buildCommand: "pip install -r requirements.txt"
    preDeployCommand: "flask --app wsgi init-db && flask --app wsgi seed"
    startCommand: "gunicorn wsgi:app --workers 2 --threads 4 --timeout 60"
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.4"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: designplus-db
          property: connectionString
      - key: SITE_URL
        sync: false          # set to the live https:// origin
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false          # used once by `flask seed`, then change it in the admin
      # Optional enquiry notifications
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: NOTIFY_EMAIL
        sync: false
    # Uploaded images live on disk; without this they vanish on every deploy.
    disk:
      name: uploads
      mountPath: /opt/render/project/src/app/static/img/uploads
      sizeGB: 1

databases:
  - name: designplus-db
    plan: basic-256mb
    databaseName: designplus
