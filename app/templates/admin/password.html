{% extends "admin/base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<div class="page-head">
  <div>
    <div class="crumb"><a href="{{ url_for('admin.dashboard') }}">Dashboard</a> / Password</div>
    <h1>Change password</h1>
    <p>At least 10 characters. A passphrase of a few unrelated words is both stronger and easier to remember than a short scramble.</p>
  </div>
</div>

<div class="panel">
  <div class="panel-body">
    <form method="POST" class="form-grid">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="field">
        <label class="field-label" for="current_password">Current password</label>
        <input type="password" id="current_password" name="current_password" required autocomplete="current-password">
      </div>
      <div class="field">
        <label class="field-label" for="new_password">New password</label>
        <input type="password" id="new_password" name="new_password" required minlength="10" autocomplete="new-password">
      </div>
      <div class="field">
        <label class="field-label" for="confirm_password">Confirm new password</label>
        <input type="password" id="confirm_password" name="confirm_password" required minlength="10" autocomplete="new-password">
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Change password</button>
        <a class="btn btn-secondary" href="{{ url_for('admin.dashboard') }}">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
